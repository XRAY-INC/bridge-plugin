[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-plugin"
version = "0.1.0"
description = "Clean-room CLI (bridge / brg) and stdio MCP plugin for Bridge (https://bridge.xray.tech) — seams, 1-click decisions, scope leases, task branching, and P16 fact ingestion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Bridge Engineering", email = "engineering@xray.tech" }
]
keywords = ["bridge", "mcp", "cli", "agents", "claude-code", "cursor", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bridge = "bridge_plugin.cli:main"
brg = "bridge_plugin.cli:main"
bridge-mcp = "bridge_plugin.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
